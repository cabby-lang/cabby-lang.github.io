<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title</title>
<meta name="description" content="$description">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/style.css">
<script src="/assets/site.js" defer></script>
</head>
<body class="$body_class" data-playground="$playground">
<a class="skip" href="#main">Skip to the content</a>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/"><img src="/assets/cabby.svg" alt="" width="32" height="32"><span>Cabby</span></a>
    <nav class="mainnav" aria-label="Main">$nav<a href="$github" class="gh">GitHub</a></nav>
    <button class="menu-toggle" aria-label="Show the contents" aria-expanded="false" hidden>Contents</button>
  </div>
</header>
<div class="layout $layout_class">
$sidebar
<main id="main">
$content
</main>
</div>
<footer class="footer">
  <div class="footer-inner">
    <p><img src="/assets/cabby.svg" alt="" width="20" height="20"> Cabby $version ($version_date) ·
    <a href="$github/blob/$tag/LICENSE">MIT License</a> · Copyright © 2026 Thomas Paul Whalan</p>
    <p><a href="/docs/">Docs</a> · <a href="/download/">Download</a> · <a href="/playground/">Playground</a> ·
    <a href="$github">Source on GitHub</a> · <a href="$github/issues">Report a problem</a></p>
  </div>
</footer>
</body>
</html>
